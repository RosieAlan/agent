name: knowledge-hub-course

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123456" # 本机课程数据库密码。
      POSTGRES_DB: knowledge_hub
    ports:
      - "127.0.0.1:5433:5432" # 5432已由旧课程占用；本机通过5433连接。
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongodb:
    image: mongo:7-jammy
    container_name: knowledge_hub_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass123
      MONGO_INITDB_DATABASE: knowledge_hub
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "-u", "mongo_user", "-p", "mongo_pass123", "--authenticationDatabase", "admin"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data: # Docker命名卷：数据库文件独立保存，重启容器后继续使用。
  mongodb_data:
