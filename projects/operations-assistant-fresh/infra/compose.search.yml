services:
  search:
    image: elasticsearch:9.2.8
    container_name: operations-search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false" # 本机演练；上线阶段配置认证和TLS。
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    mem_limit: 1g
    volumes:
      - search-data:/usr/share/elasticsearch/data
    restart: unless-stopped
volumes:
  search-data:
